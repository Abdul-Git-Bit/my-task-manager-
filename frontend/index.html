<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Team Task Manager</title>
    <link rel="stylesheet" href="/style.css">
</head>

<body>
    <div class="container">
        <!-- Login/Signup Section -->
        <div id="authSection" class="auth-section">
            <div class="form-container">
                <div class="form-switch">
                    <button id="showLoginBtn" class="active">Login</button>
                    <button id="showSignupBtn">Sign Up</button>
                </div>

                <!-- Login Form -->
                <form id="loginForm" class="form active">
                    <h2>Welcome Back</h2>
                    <input type="email" id="loginEmail" placeholder="Email" required>
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <button type="submit">Login</button>
                    <p class="message"></p>
                </form>

                <!-- Signup Form -->
                <form id="signupForm" class="form">
                    <h2>Create Account</h2>
                    <input type="text" id="signupName" placeholder="Full Name" required>
                    <input type="email" id="signupEmail" placeholder="Email" required>
                    <input type="password" id="signupPassword" placeholder="Password" required>
                    <select id="signupRole">
                        <option value="member">Member</option>
                        <option value="admin">Admin</option>
                    </select>
                    <button type="submit">Sign Up</button>
                    <p class="message"></p>
                </form>
            </div>
        </div>

        <!-- Dashboard -->
        <div id="dashboardSection" class="dashboard-section" style="display: none;">
            <div class="dashboard-header">
                <h1>📋 Team Task Manager</h1>
                <div class="user-info">
                    <span id="userName"></span>
                    <span id="userRole" class="user-role"></span>
                    <button id="logoutBtn" class="logout-btn">Logout</button>
                </div>
            </div>

            <!-- Projects Section -->
            <div class="project-section">
                <div class="project-header">
                    <h2>📁 My Projects</h2>
                    <button id="createProjectBtn" class="create-project-btn">+ New Project</button>
                </div>
                <div id="projectsList" class="projects-list">
                    <div class="loading">Loading projects...</div>
                </div>
            </div>

            <!-- Selected Project Details -->
            <div id="selectedProjectSection" style="display: none;">
                <div class="project-details-header">
                    <h3 id="selectedProjectName"></h3>
                    <button id="addMemberBtn" class="add-member-btn">+ Add Member</button>
                </div>

                <!-- Members List -->
                <div class="members-section">
                    <h4>Team Members</h4>
                    <div id="membersList" class="members-list"></div>
                </div>

                <!-- Add Task Form -->
                <div class="add-task">
                    <input type="text" id="taskTitle" placeholder="Task title..." required>
                    <input type="text" id="taskDesc" placeholder="Description">
                    <select id="taskAssignee">
                        <option value="">Assign to...</option>
                    </select>
                    <input type="date" id="taskDueDate" required>
                    <select id="taskPriority">
                        <option value="low">Low Priority</option>
                        <option value="medium" selected>Medium Priority</option>
                        <option value="high">High Priority</option>
                    </select>
                    <button id="addTaskBtn">+ Add Task</button>
                </div>

                <!-- Tasks List -->
                <div class="tasks-list">
                    <h4>Tasks</h4>
                    <div id="tasksContainer" class="tasks"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Project Modal -->
    <div id="projectModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Create New Project</h2>
            <input type="text" id="projectName" placeholder="Project Name" required>
            <textarea id="projectDesc" placeholder="Project Description"></textarea>
            <button id="saveProjectBtn">Create Project</button>
        </div>
    </div>

    <!-- Add Member Modal -->
    <div id="memberModal" class="modal" style="display: none;">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Add Team Member</h2>
            <input type="email" id="memberEmail" placeholder="Member's Email" required>
            <button id="saveMemberBtn">Add to Project</button>
        </div>
    </div>

    <script src="/script.js"></script>
</body>

</html>
